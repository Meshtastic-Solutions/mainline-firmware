; Meshnology W10
; ESP32-S3R8, E22-900MM22S (SX1262), L76KB-A58 GPS, SSD1306 OLED (SPI),
; AXP2101 PMU, TCA9555 I/O expander, PCF85063A RTC, QMI8658C IMU, SHT41, ES8311
; Schematic: W10-MB-Sch-V1_1-0501106.pdf
; Readyline: https://readyline.meshtastic.com/devices/5bcfeb39-ed68-4770-ad67-7261d34f709b

[env:meshnology_w10]
custom_meshtastic_hw_model = 140
custom_meshtastic_hw_model_slug = MESHNOLOGY_W10
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Meshnology W10
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB

board = meshnology-w10
board_level = pr
board_check = true
board_build.partitions = default_16MB.csv
upload_protocol = esptool

extends = esp32s3_base

lib_deps = ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=SensorLib packageName=lewisxhe/library/SensorLib
  lewisxhe/SensorLib@0.3.4

build_flags =
  ${esp32s3_base.build_flags}
  -D MESHNOLOGY_W10
  -I variants/esp32s3/meshnology-w10
  -D BOARD_HAS_PSRAM
  ; TCA9555 I/O expander I2C address (A0=A1=A2=0 pulled low → 0x20)
  ; TODO: verify A0/A1/A2 pull levels on physical board
  -D IO_EXPANDER=0x20
  -D IO_EXPANDER_IRQ=RADIOLIB_NC
